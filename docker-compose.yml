services:
  proxy:
    image: nginx:alpine
    container_name: closign-proxy
    ports:
      - "8080:8080"
    volumes:
      - ./src/proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_started
    restart: unless-stopped
    networks:
      - no-internet
      - internet

  php:
    build:
      context: .
      dockerfile: ./.docker/php/Dockerfile
    container_name: closign-php
    volumes:
      - ./src/app:/var/www/html
    environment:
      XDEBUG_CONFIG: "client_host=host.docker.internal client_port=9003 mode=debug start_with_request=yes"
      PHP_IDE_CONFIG: "serverName=php-docker"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command: "php -S 0.0.0.0:8000 -t /var/www/html"
    networks:
      - no-internet

networks:
  internet: {}
  no-internet: {}